name: Hardware-free quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev,serial,gui]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest --cov=coherent_verdi --cov-report=term-missing --junitxml=records/junit.xml
      - run: python -m build
      - run: python examples/simulated_session.py
      - run: python examples/async_integration.py
      - run: python scripts/install_smoke.py
      - run: node scripts/test_watchdog.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: records/junit.xml
