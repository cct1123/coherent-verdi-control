[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coherent-verdi-control"
version = "0.1.0"
description = "Manual-grounded Coherent Verdi controller with hardware-free simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]
gui = ["dash>=3,<5"]
tutorials = ["jupyterlab>=4,<5", "nbclient>=0.10,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2", "types-pyserial>=3.5", "setuptools>=77", "wheel>=0.45", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
verdi = "coherent_verdi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coherent_verdi = ["py.typed", "assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/coherent_verdi"]

[[tool.mypy.overrides]]
module = ["dash.*"]
ignore_missing_imports = true
