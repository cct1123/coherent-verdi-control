[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coherent-verdi-control"
version = "0.5.0"
description = "Python RS-232 controller for Coherent Verdi V-2, V-5 and V-6 lasers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5,<4"]

[project.urls]
Repository = "https://github.com/cct1123/coherent-verdi-control"

[project.optional-dependencies]
gui = [
    "dash>=3,<5",
    "dash-bootstrap-components>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<3", "types-pyserial>=3.5"]

[project.scripts]
verdi = "coherent_verdi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coherent_verdi = ["py.typed", "assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/coherent_verdi"]

[[tool.mypy.overrides]]
module = ["dash.*", "dash_bootstrap_components.*"]
ignore_missing_imports = true
